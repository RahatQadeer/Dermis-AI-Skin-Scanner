name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify max-lines rule
        run: npm run verify:max-lines

      - name: Tests
        run: npm test

      - name: Build (Expo web export)
        run: npm run build

  # After CI is green on main, tell Render to pull and redeploy the API.
  # Secret: Render → Service → Settings → Deploy Hook → GitHub Actions secret
  # RENDER_DEPLOY_HOOK_URL. Leave unset to skip (local forks).
  deploy-render:
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping Render deploy."
            exit 0
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}"
          echo "Render deploy triggered."
